# Address space contract for water_plant_DCS.
#
# This file is the single source of truth for every OPC UA node exposed by a
# PLC unit. plc/, dcs/, and hmi/ all read this file. Do not add, rename, or
# remove tags without updating this file first, since plantbus generates both
# the server nodes and the client subscriptions from it.
#
# Namespace: each PLC unit runs its own OPC UA server. The unit identifier
# (Unit1, Unit2, ...) is the server's own namespace root, not a prefix baked
# into node names, so the same tag list applies to every unit.
#
# Access: R = client may read, RW = client may read and write.
# The DCS is the only client allowed to write PID.SP and Level.SP. The HMI
# writes APC.Enabled and, in manual mode, PID.SP for the unit under test.
#
# PID.SP is a FLOW setpoint (cm3/s), not a level setpoint: the PLC's local
# "PID" stage is a static, no-feedback flow-to-Pump.CMD conversion (there
# is no flow sensor in the real rig either, just a calibration curve), so
# there is nothing for a closed level loop to chase locally. The DCS's MPC
# already computes an optimal flow every solve (that is what it optimizes
# for); writing that number straight through, instead of translating it
# into a level point first, is both simpler and avoids the level<->flow
# translation this project's earlier design needed and had to tune
# empirically to keep stable (see OPEN_QUESTIONS.md). Level.SP is where
# the DCS's actual level target lives instead (see that tag below).

unit:
  description: >
    One process unit: a pump-fed upstream tank draining by gravity into a
    downstream tank, which drains by gravity to the sump, plus a local
    flow-to-command conversion (see the PID.SP note above -- "PID" here is
    a naming holdover, not a closed loop). Matches the original Vodarna
    rig's physics exactly (see reference/water_mpc/). There is no valve
    anywhere in the real rig, one actuator only (the pump) and two fixed
    gravity orifices; earlier versions of this contract had Pump+Valve on
    a single tank, which did not match the rig this project is modeling
    and has been removed.
  tags:
    Level.PV:
      type: float
      unit: m
      access: R
      description: >
        Measured level of the downstream tank (the one with the real
        sensor). The upstream tank has no sensor in the real rig either;
        the DCS estimates it internally with an EKF and publishes that
        estimate as a diagnostic-only OPC UA node on its own server
        (Unit{n}/Diagnostics/H1_Estimated, not part of this contract,
        see dcs/global_server.py).
    Level.SP:
      type: float
      unit: m
      access: RW
      description: >
        The level the DCS/APC is currently trying to reach (the active
        cycle's current value, or the manual constant), written by the
        DCS every control cycle. Not part of the control loop itself
        (that operates on flow, see PID.SP) -- purely the target for the
        HMI/operator to compare against Level.PV. The PLC neither
        computes nor writes this tag.
    Level.HH:
      type: float
      unit: m
      access: R
      description: High-high level interlock threshold.
    Level.LL:
      type: float
      unit: m
      access: R
      description: Low-low level interlock threshold.

    Pump.CMD:
      type: float
      unit: percent
      access: R
      description: Pump command output from the PID (0-100).
    Pump.FB:
      type: float
      unit: percent
      access: R
      description: Pump feedback, equals CMD in this simulation (no actuator lag modeled).
    Pump.Running:
      type: bool
      access: R
      description: Pump running status. False when tripped or commanded to zero.

    PID.SP:
      type: float
      unit: cm3/s
      access: RW
      description: >
        Cascade flow setpoint written by the DCS (the MPC's own optimal
        flow output, see the top-of-file note). The PLC converts this
        directly to Pump.CMD via a fixed calibration curve in CASCADE
        mode, no closed loop. Written exclusively by the DCS/APC layer,
        never by the HMI directly except when forcing a unit into
        MANUAL/local test (where it means a direct flow override, not a
        level).
    PID.OUT:
      type: float
      unit: percent
      access: R
      description: Commanded flow-to-percent output before the interlock zeroes it.
    PID.Mode:
      type: string
      access: R
      enum: [AUTO, MAN, CASCADE]
      description: >
        AUTO = fail-safe, flow forced to 0. MAN = operator drives Pump.CMD
        directly. CASCADE = Pump.CMD follows PID.SP (a flow command) from
        the DCS. The PLC itself demotes CASCADE to AUTO (flow -> 0) on a
        stale PID.SP watchdog trip -- the safe default on a lost cascade
        is no flow, not holding the last commanded value.

    Interlock.Trip:
      type: bool
      access: R
      description: Latched safety trip. Requires manual reset at the PLC.
    Interlock.Reason:
      type: string
      access: R
      description: Human-readable reason for the last trip (HH level, LL level, dry run).

    Status.Heartbeat:
      type: uint
      access: R
      description: Free-running counter incremented once per PLC scan. Used by DCS/HMI to detect a dead unit.
    Status.ScanTime_ms:
      type: float
      unit: ms
      access: R
      description: Measured wall-clock duration of the last scan's execute-logic
        step only (physics integration, interlocks, flow-to-Pump.CMD conversion) --
        not the surrounding OPC UA read/write, and not the same thing as the scan
        *period* (see Status.ScanJitter_ms). Tenths of a millisecond in this
        simulation; display with at least one decimal place, not rounded to whole ms.
    Status.ScanJitter_ms:
      type: float
      unit: ms
      access: R
      description: Largest absolute deviation, since shortly after this process
        started (the first few scans are excluded, see plc/unit.py's
        JITTER_WARMUP_SCANS -- OPC UA's own session/subscription warm-up is a
        one-time cost, not ongoing jitter), between the actual wall-clock time from
        one scan's start to the next and the nominal 100 ms scan period
        (SCAN_PERIOD_S). Status.ScanTime_ms alone cannot show this, since it
        excludes the OPC UA I/O and the asyncio.sleep that fill out the rest of the
        100 ms budget -- a Python sleep-based loop does not hold cadence exactly,
        and this is the honest measure of how far it drifts.

global:
  description: Plant-wide tags, not per-unit. Live on the DCS OPC UA presence (published via the DCS's own server-side status, consumed by the HMI).
  tags:
    APC.Enabled:
      type: bool
      access: RW
      description: Master on/off switch for the MPC layer. Written by the HMI.
    APC.SolveTime_ms:
      type: float
      unit: ms
      access: R
      description: Wall-clock duration of the last MPC solve.
    APC.Status:
      type: string
      access: R
      enum: [OK, DEGRADED, SOLVER_FAIL, DISABLED]
      description: >
        OK = solving and writing setpoints normally. DEGRADED = one or more
        units dropped from the optimization (dead heartbeat). SOLVER_FAIL =
        last solve did not converge or exceeded its time budget, last good
        setpoints held. DISABLED = APC.Enabled is false.
